<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11110e">
<title>Broken Runnels — Greywake 360</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11110e;color:#eee;font-family:Inter,Arial,sans-serif;overscroll-behavior:none}
#viewer{position:fixed;inset:0;background-color:#11110e;background-image:url('https://raw.githubusercontent.com/potmoodle-debug/greywake-players/7fd42ab90fe91704bfc8f054917a0e1bfe1b0e20/assets/360/broken-runnels-360-tiny.jpg');background-repeat:repeat-x;background-size:auto 145%;background-position:50% 50%;cursor:grab;touch-action:none;user-select:none}
#viewer.dragging{cursor:grabbing}
#bar{position:fixed;z-index:20;left:12px;top:12px;background:rgba(10,10,8,.82);border:1px solid #5b5233;padding:10px 12px;max-width:390px;box-shadow:0 10px 30px #0007}
#bar strong{font:22px Georgia,serif;display:block;margin-bottom:4px}
#bar span{font-size:12px;color:#c8c0ab;line-height:1.4;display:block;margin-bottom:8px}
#bar a,#bar button{display:inline-block;color:#eadba9;text-decoration:none;border:1px solid #5b5233;background:#161611;padding:7px 9px;font-size:11px;cursor:pointer;margin-right:6px}
#tip{position:fixed;z-index:20;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(10,10,8,.75);border:1px solid #4c452f;color:#d4ccb5;padding:8px 11px;font-size:11px;pointer-events:none;transition:opacity .5s}
#loading{position:fixed;z-index:30;inset:0;display:grid;place-items:center;background:#11110e;color:#c9b778;font-size:12px;letter-spacing:.08em}
@media(max-width:600px){#bar{left:8px;top:8px;max-width:calc(100vw - 34px)}#bar strong{font-size:19px}#tip{max-width:calc(100vw - 30px);text-align:center}}
</style>
</head>
<body>
<div id="viewer" aria-label="Interactive panoramic view of the Broken Runnels"></div>
<div id="loading">Loading Broken Runnels…</div>
<div id="bar">
  <strong>Broken Runnels · 360°</strong>
  <span>Drag to look around. Mouse wheel or pinch changes zoom. This viewer does not require WebGL.</span>
  <a href="index.html">← Back to Greywake</a>
  <button id="full">Fullscreen</button>
</div>
<div id="tip">Drag left/right and up/down to explore</div>
<script>
(() => {
  const viewer=document.getElementById('viewer');
  const loading=document.getElementById('loading');
  const imageUrl='https://raw.githubusercontent.com/potmoodle-debug/greywake-players/7fd42ab90fe91704bfc8f054917a0e1bfe1b0e20/assets/360/broken-runnels-360-tiny.jpg';
  const probe=new Image();
  probe.onload=()=>{loading.style.display='none'};
  probe.onerror=()=>{loading.textContent='Panorama image could not load';};
  probe.src=imageUrl;

  let x=50,y=50,zoom=145,drag=false,lastX=0,lastY=0,pinchStart=0,zoomStart=zoom;
  function apply(){
    viewer.style.backgroundPosition=x+'% '+y+'%';
    viewer.style.backgroundSize='auto '+zoom+'%';
  }
  viewer.addEventListener('pointerdown',e=>{
    drag=true;lastX=e.clientX;lastY=e.clientY;viewer.classList.add('dragging');viewer.setPointerCapture?.(e.pointerId);
  });
  viewer.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
    x-=dx/innerWidth*100;
    y-=dy/innerHeight*55;
    while(x<0)x+=100;while(x>100)x-=100;
    y=Math.max(28,Math.min(72,y));
    apply();
  });
  function stop(){drag=false;viewer.classList.remove('dragging')}
  viewer.addEventListener('pointerup',stop);viewer.addEventListener('pointercancel',stop);
  viewer.addEventListener('wheel',e=>{
    e.preventDefault();zoom=Math.max(105,Math.min(230,zoom+e.deltaY*.08));apply();
  },{passive:false});
  viewer.addEventListener('touchstart',e=>{
    if(e.touches.length===2){pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoomStart=zoom}
  },{passive:true});
  viewer.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&pinchStart){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom=Math.max(105,Math.min(230,zoomStart+(d-pinchStart)*.18));apply()}
  },{passive:true});
  document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
  setTimeout(()=>document.getElementById('tip').style.opacity='.25',6500);
  apply();
})();
</script>
</body>
</html>
