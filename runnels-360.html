<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11110e">
<title>Broken Runnels — Greywake 360</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11110e;color:#eee;font-family:Inter,Arial,sans-serif}
#viewer{width:100%;height:100vh;background:#11110e}
#bar{position:fixed;z-index:20;left:12px;top:12px;background:rgba(10,10,8,.82);border:1px solid #5b5233;padding:10px 12px;max-width:390px}
#bar strong{font:22px Georgia,serif;display:block;margin-bottom:4px}
#bar span{font-size:12px;color:#c8c0ab;line-height:1.4;display:block;margin-bottom:8px}
#bar a{display:inline-block;color:#eadba9;text-decoration:none;border:1px solid #5b5233;padding:7px 9px;font-size:11px}
</style>
</head>
<body>
<div id="viewer"></div>
<div id="bar">
  <strong>Broken Runnels · 360°</strong>
  <span>Click and drag to look around. On phones and tablets, drag with one finger.</span>
  <a href="index.html">← Back to Greywake</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
pannellum.viewer('viewer',{
  type:'equirectangular',
  panorama:'https://raw.githubusercontent.com/potmoodle-debug/greywake-players/7fd42ab90fe91704bfc8f054917a0e1bfe1b0e20/assets/360/broken-runnels-360-tiny.jpg',
  autoLoad:true,
  showControls:true,
  compass:false,
  hfov:80,
  yaw:-90,
  pitch:0
});
</script>
</body>
</html>
