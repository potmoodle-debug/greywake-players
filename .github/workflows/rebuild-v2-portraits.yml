name: Rebuild v2 NPC portraits

on:
  push:
    paths:
      - '.github/workflows/rebuild-v2-portraits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild ordinary web image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/npcs/v2

          cat .staging/portrait-rebuild/sister/0*.b64 | base64 --decode > assets/npcs/v2/sister-elowen-player-portrait.jpg
          cat .staging/portrait-rebuild/brannic/01.b64 \
              .staging/portrait-rebuild/brannic/02a.b64 \
              .staging/portrait-rebuild/brannic/02b.b64 \
              .staging/portrait-rebuild/brannic/03.b64 \
              .staging/portrait-rebuild/brannic/04.b64 \
              .staging/portrait-rebuild/brannic/05.b64 \
              .staging/portrait-rebuild/brannic/06.b64 | base64 --decode > assets/npcs/v2/brannic-hale-player-portrait.jpg

          echo '5db19fad41244435629a69dd218e89a6afe0ddd8a696246c67e1133ed7cec3e9  assets/npcs/v2/sister-elowen-player-portrait.jpg' | sha256sum -c -
          echo '9c505ba7614fbdbd3e044935e8ad1dd46f1f00c12a064531a456858f523c2a8e  assets/npcs/v2/brannic-hale-player-portrait.jpg' | sha256sum -c -

          python - <<'PY'
          from pathlib import Path

          app = Path('v2/app.js')
          lines = app.read_text(encoding='utf-8').splitlines()
          found = {'Brannic Hale': False, 'Sister Elowen': False}
          out = []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("'Brannic Hale':"):
                  out.append("    'Brannic Hale':[{src:'assets/npcs/v2/brannic-hale-player-portrait.jpg',caption:'Brannic Hale — commander of the Tower Watch.'}],")
                  found['Brannic Hale'] = True
              elif stripped.startswith("'Sister Elowen':"):
                  out.append("    'Sister Elowen':[{src:'assets/npcs/v2/sister-elowen-player-portrait.jpg',caption:'Sister Elowen — public voice among the Faithful.'}],")
                  found['Sister Elowen'] = True
              else:
                  out.append(line)
          if not all(found.values()):
              raise SystemExit(f'Expected NPC media mappings were not both found: {found}')
          app.write_text('\n'.join(out) + '\n', encoding='utf-8')

          index = Path('v2/index.html')
          text = index.read_text(encoding='utf-8')
          old = 'v2/app.js?v=brannic-hq-1'
          if old not in text:
              raise SystemExit('Expected v2 app cache-buster was not found')
          index.write_text(text.replace(old, 'v2/app.js?v=portraits-20260810'), encoding='utf-8')
          PY

          rm -f assets/npcs/v2/brannic-hale.jpg
          rm -f assets/npcs/v2/sister-elowen.jpg
          rm -f v2/brannic-hq.js
          rm -rf .staging/portrait-rebuild

      - name: Commit v2 portrait update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Use canonical v2 NPC portrait assets'
          git push origin HEAD:main
