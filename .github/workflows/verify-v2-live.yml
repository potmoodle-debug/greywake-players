name: Verify Greywake v2 live

on:
  push:
    paths:
      - '.github/workflows/verify-v2-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed portrait files
        shell: bash
        run: |
          set -euo pipefail
          base='https://potmoodle-debug.github.io/greywake-players/assets/npcs/v2'
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 "$base/sister-elowen-player-portrait.jpg?verify=e1595047" -o /tmp/sister.jpg
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 "$base/brannic-hale-player-portrait.jpg?verify=e1595047" -o /tmp/brannic.jpg
          echo 'bf6f58c9fd93783ba45620fc57362df51b354fdcdf1152770ec3c8003246a80a  /tmp/sister.jpg' | sha256sum -c -
          echo '05b2e98253c43d5f8049cd0065820d285f622cb37ddb930929cb5e8c2ab1bcfd  /tmp/brannic.jpg' | sha256sum -c -
          file /tmp/sister.jpg /tmp/brannic.jpg

      - name: Install browser test tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check selenium
          (google-chrome --version || google-chrome-stable --version || chromium --version)

      - name: Verify Sister Elowen and Brannic Hale live records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from urllib.parse import quote
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          BASE='https://potmoodle-debug.github.io/greywake-players/v2/'
          options=webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1000')
          driver=webdriver.Chrome(options=options)
          wait=WebDriverWait(driver,25)

          def check_record(name, asset, required_text, forbidden=()):
              driver.get(BASE+'#/record/'+quote(name))
              wait.until(lambda d: name in d.find_element(By.CSS_SELECTOR,'#recordView h1').text)
              img=wait.until(lambda d: d.find_element(By.CSS_SELECTOR, f"#recordView .record-media img[src*='{asset}']"))
              wait.until(lambda d: d.execute_script('return arguments[0].complete && arguments[0].naturalWidth > 0 && arguments[0].naturalHeight > 0', img))
              assert img.get_attribute('src').startswith('https://potmoodle-debug.github.io/greywake-players/assets/npcs/v2/'), img.get_attribute('src')
              text=driver.find_element(By.ID,'recordView').text
              assert required_text in text, text
              low=text.lower()
              for word in forbidden:
                  assert word.lower() not in low, f'Forbidden public wording {word!r} found in {name}'

          check_record('Sister Elowen','sister-elowen-player-portrait.jpg','public voice among the Faithful')
          check_record('Brannic Hale','brannic-hale-player-portrait.jpg','commander of the Tower Watch',('ration records','cistern keeper'))
          driver.quit()
          print('Live NPC portrait records passed.')
          PY

      - name: Verify Player Brain desktop interaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait, Select
          from selenium.webdriver.common.action_chains import ActionChains

          BASE='https://potmoodle-debug.github.io/greywake-players/v2/'
          options=webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1000')
          driver=webdriver.Chrome(options=options)
          wait=WebDriverWait(driver,25)
          driver.get(BASE+'#/brain')
          wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR,'#graph .brain-circle-node.is-center'))==1)
          wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR,'#graph .brain-circle-node:not(.is-center)'))>0)

          jump=Select(driver.find_element(By.ID,'brainJump'))
          jump.select_by_value('Brannic Hale')
          wait.until(lambda d: d.find_element(By.CSS_SELECTOR,'#graph .brain-circle-node.is-center').get_attribute('data-name')=='Brannic Hale')
          time.sleep(.6)

          status=driver.find_element(By.ID,'brainHoverStatus')
          svg=driver.find_element(By.CSS_SELECTOR,'#graph .brain-network-svg')
          assert status.rect['y'] >= svg.rect['y'], 'Relationship/status panel is not below the graph.'
          assert 'Brannic Hale' in status.text and 'direct' in status.text.lower(), status.text

          neighbor=driver.find_element(By.CSS_SELECTOR,'#graph .brain-circle-node:not(.is-center)')
          neighbor_name=neighbor.get_attribute('data-name')
          ActionChains(driver).move_to_element(neighbor).perform()
          wait.until(lambda d: neighbor_name in d.find_element(By.ID,'brainHoverStatus').text)
          neighbor.click()
          wait.until(lambda d: d.find_element(By.CSS_SELECTOR,'#graph .brain-circle-node.is-center').get_attribute('data-name')==neighbor_name)
          time.sleep(.6)

          back=driver.find_element(By.ID,'brainBackFocus')
          assert back.is_enabled(), 'Previous Focus did not enable after a focus change.'
          back.click()
          wait.until(lambda d: d.find_element(By.CSS_SELECTOR,'#graph .brain-circle-node.is-center').get_attribute('data-name')=='Brannic Hale')
          time.sleep(.6)

          center=driver.find_element(By.CSS_SELECTOR,'#graph .brain-circle-node.is-center')
          center.click()
          wait.until(lambda d: '#/record/Brannic%20Hale' in d.current_url or '#/record/Brannic%20Hale'.lower() in d.current_url.lower())
          wait.until(lambda d: 'Brannic Hale' in d.find_element(By.CSS_SELECTOR,'#recordView h1').text)
          driver.quit()
          print('Player Brain desktop interaction passed.')
          PY

      - name: Verify Player Brain mobile interaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait, Select

          BASE='https://potmoodle-debug.github.io/greywake-players/v2/'
          options=webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          mobile={'deviceMetrics':{'width':390,'height':844,'pixelRatio':2.0},'userAgent':'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/151 Mobile Safari/537.36'}
          options.add_experimental_option('mobileEmulation',mobile)
          driver=webdriver.Chrome(options=options)
          wait=WebDriverWait(driver,25)
          driver.get(BASE+'#/brain')
          wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR,'#graph .brain-circle-node.is-center'))==1)
          Select(driver.find_element(By.ID,'brainJump')).select_by_value('Sister Elowen')
          wait.until(lambda d: d.find_element(By.CSS_SELECTOR,'#graph .brain-circle-node.is-center').get_attribute('data-name')=='Sister Elowen')
          time.sleep(.6)
          neighbor=driver.find_element(By.CSS_SELECTOR,'#graph .brain-circle-node:not(.is-center)')
          target=neighbor.get_attribute('data-name')
          driver.execute_script('arguments[0].scrollIntoView({block:"center"});',neighbor)
          driver.execute_script('arguments[0].click();',neighbor)
          wait.until(lambda d: d.find_element(By.CSS_SELECTOR,'#graph .brain-circle-node.is-center').get_attribute('data-name')==target)
          assert driver.find_element(By.ID,'brainBackFocus').is_enabled()
          driver.quit()
          print('Player Brain mobile interaction passed.')
          PY
