name: Publish PR preview into GitHub Pages tree

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr

      - name: Run Greywake smoke checks
        working-directory: pr
        run: node tests/smoke.mjs

      - name: Check critical JavaScript syntax
        working-directory: pr
        run: |
          node --check player-access.js
          node --check character-page.js
          node --check beastform.js
          node --check rest-system-v2.js
          node --check action-roller.js
          node --check companion-play.js
          node --check trait-roller.js

      - name: Copy PR into isolated preview path
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER='${{ github.event.pull_request.number }}'
          DEST="site/preview/pr-${{ github.event.pull_request.number }}"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='preview/' \
            pr/ "$DEST/"
          test -f "$DEST/index.html"
          test -f "$DEST/assets/tower-distant.jpg"

      - name: Commit preview snapshot to main
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "preview/pr-${{ github.event.pull_request.number }}"
          if git diff --cached --quiet; then
            echo 'Preview snapshot already current.'
          else
            git commit -m "Publish preview for PR #${{ github.event.pull_request.number }}"
            git push origin main
          fi

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const previewUrl = `https://${owner}.github.io/${repo}/preview/pr-${number}/`;
            const marker = '<!-- greywake-pr-preview -->';
            const body = `${marker}\n## GitHub Pages preview\n\n[Open PR #${number} as a live site](${previewUrl})\n\nPublished from PR commit \`${sha.slice(0, 7)}\` into an isolated preview folder. The normal site root is unchanged. The snapshot is removed automatically when the PR closes.`;
            const { data: comments } = await github.rest.issues.listComments({owner, repo, issue_number: number, per_page: 100});
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number: number, body});

  cleanup-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove closed PR preview
        shell: bash
        run: |
          set -euo pipefail
          DEST="preview/pr-${{ github.event.pull_request.number }}"
          if [ ! -d "$DEST" ]; then
            echo "No preview snapshot exists for PR #${{ github.event.pull_request.number }}."
            exit 0
          fi
          rm -rf "$DEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$DEST"
          git commit -m "Remove preview for PR #${{ github.event.pull_request.number }}"
          git push origin main
