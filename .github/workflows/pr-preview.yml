name: Publish PR preview into GitHub Pages tree

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr

      - name: Copy PR into isolated preview path
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER='${{ github.event.pull_request.number }}'
          DEST="site/preview/pr-${PR_NUMBER}"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='preview/' \
            pr/ "$DEST/"
          test -f "$DEST/index.html"
          test -f "$DEST/assets/tower-distant.jpg"

      - name: Commit preview snapshot to main
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "preview/pr-${{ github.event.pull_request.number }}"
          if git diff --cached --quiet; then
            echo 'Preview snapshot already current.'
          else
            git commit -m "Publish preview for PR #${{ github.event.pull_request.number }}"
            git push origin main
          fi

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const previewUrl = `https://${owner}.github.io/${repo}/preview/pr-${number}/`;
            const marker = '<!-- greywake-pr-preview -->';
            const body = `${marker}\n## GitHub Pages preview\n\n[Open PR #${number} as a live site](${previewUrl})\n\nPublished from PR commit \`${sha.slice(0, 7)}\` into an isolated preview folder. The normal site root is unchanged.`;
            const { data: comments } = await github.rest.issues.listComments({owner, repo, issue_number: number, per_page: 100});
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number: number, body});
