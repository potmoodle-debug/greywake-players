name: PR GitHub Pages preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr

      - name: Check out main for manual test
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: main
          path: pr

      - name: Build combined live plus preview site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          # Mirror the site that is live right now so the public root remains unchanged.
          wget --quiet --recursive --no-parent --page-requisites \
            --convert-links --adjust-extension \
            --directory-prefix _mirror \
            https://potmoodle-debug.github.io/greywake-players/

          LIVE_DIR="_mirror/potmoodle-debug.github.io/greywake-players"
          test -f "$LIVE_DIR/index.html"
          cp -a "$LIVE_DIR"/. _site/

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER="manual"
          fi

          PREVIEW_DIR="_site/preview/pr-${PR_NUMBER}"
          mkdir -p "$PREVIEW_DIR"
          cp -a pr/. "$PREVIEW_DIR/"
          rm -rf "$PREVIEW_DIR/.git" "$PREVIEW_DIR/.github"

          # Reuse any deploy-generated assets from the currently live site when
          # the PR branch does not contain them itself.
          if [ -d _site/assets/generated ]; then
            mkdir -p "$PREVIEW_DIR/assets/generated"
            cp -an _site/assets/generated/. "$PREVIEW_DIR/assets/generated/" || true
          fi

          # Required sanity checks for the visual refresh preview.
          test -f "$PREVIEW_DIR/index.html"
          test -f "$PREVIEW_DIR/assets/tower-distant.jpg"

          echo "Preview prepared at /greywake-players/preview/pr-${PR_NUMBER}/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy preview without changing live root content
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const previewUrl = `https://${owner}.github.io/${repo}/preview/pr-${number}/`;
            const marker = '<!-- greywake-pr-preview -->';
            const body = `${marker}\n## GitHub Pages preview\n\n[Open PR #${number} as a live site](${previewUrl})\n\nThis is an isolated preview of commit \`${sha.slice(0, 7)}\`. The normal site root remains the previously published live version.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: number, per_page: 100
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: number, body});
            }
