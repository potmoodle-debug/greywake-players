name: PR live preview link

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  preview-link:
    runs-on: ubuntu-latest
    steps:
      - name: Post live preview link
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const previewUrl = `https://raw.githack.com/${owner}/${repo}/${sha}/index.html`;
            const marker = '<!-- greywake-pr-preview -->';
            const body = `${marker}\n## Live preview\n\n[Open this PR as a live site](${previewUrl})\n\nThis preview is built directly from commit \`${sha.slice(0, 7)}\` and does not change the live GitHub Pages site.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body
              });
            }
