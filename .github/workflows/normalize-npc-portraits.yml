# Greywake NPC portrait normalizer. Safe to rerun.
name: Normalize NPC portraits

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow pillow-avif-plugin
      - name: Recover and convert remaining NPC portraits to AVIF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .staging/npc-avif-src
          decode_one() { tr -d '\n\r ' < "$1" | base64 --decode > "$2"; }
          decode_one assets/obsidian-b64/talla-reed/01.b64 .staging/npc-avif-src/talla-reed.img
          decode_one assets/obsidian-b64/joric-noll/01.b64 .staging/npc-avif-src/joric-noll.img
          decode_one assets/obsidian-b64/bessa-trant/01.b64 .staging/npc-avif-src/bessa-trant.img
          decode_one assets/obsidian-b64/hessa-vey/01.b64 .staging/npc-avif-src/hessa-vey.img
          cat assets/npcs/portraits/maela-rusk/01.b64 assets/npcs/portraits/maela-rusk/02.b64 assets/npcs/portraits/maela-rusk/03.b64 assets/npcs/portraits/maela-rusk/04.b64 | tr -d '\n\r ' | base64 --decode > .staging/npc-avif-src/maela-rusk.img

          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import pillow_avif

          root = Path('assets/npcs/v2')
          sources = {
              Path('assets/npcs/v2/brannic-hale-player-portrait.jpg'): root / 'brannic-hale.avif',
              Path('assets/npcs/v2/sister-elowen-player-portrait.jpg'): root / 'sister-elowen.avif',
              Path('.staging/npc-avif-src/talla-reed.img'): root / 'talla-reed.avif',
              Path('.staging/npc-avif-src/joric-noll.img'): root / 'joric-noll.avif',
              Path('.staging/npc-avif-src/bessa-trant.img'): root / 'bessa-trant.avif',
              Path('.staging/npc-avif-src/hessa-vey.img'): root / 'hessa-vey.avif',
              Path('.staging/npc-avif-src/maela-rusk.img'): root / 'maela-rusk.avif',
          }
          for src, out in sources.items():
              if not src.exists():
                  raise SystemExit(f'Missing portrait source: {src}')
              with Image.open(src) as im:
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGB')
                  im.save(out, format='AVIF', quality=82, speed=6)
                  print(f'{src} -> {out}')
          PY
      - name: Commit AVIF portraits
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/npcs/v2/*.avif
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize NPC portraits to AVIF'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
