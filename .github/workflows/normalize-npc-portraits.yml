name: Rebuild Mara Vell portrait

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild-mara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Rebuild Mara Vell AVIF only
        shell: bash
        run: |
          set -euo pipefail
          cat \
            assets/obsidian-b64/mara-vell-avif/01.b64 \
            assets/obsidian-b64/mara-vell-avif/02.b64 \
            assets/obsidian-b64/mara-vell-avif/03.b64 \
            assets/obsidian-b64/mara-vell-avif/04.b64 \
            | tr -d '\n\r ' \
            | base64 --decode \
            > assets/npcs/v2/mara-vell.avif
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/npcs/v2/mara-vell.avif
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild Mara Vell AVIF'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
