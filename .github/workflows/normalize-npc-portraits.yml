name: Rebuild High Keeper Varn portrait

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild-varn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow pillow-avif-plugin
      - name: Rebuild High Keeper Varn AVIF only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .staging/varn
          tr -d '\n\r ' < assets/obsidian-b64/high-keeper-varn/01.b64 | base64 --decode > .staging/varn/source.webp
          python <<'PY'
          from PIL import Image
          import pillow_avif
          src = '.staging/varn/source.webp'
          out = 'assets/npcs/v2/high-keeper-varn.avif'
          with Image.open(src) as im:
              im = im.convert('RGB')
              im.save(out, format='AVIF', quality=82, speed=6)
              print('rebuilt', out, im.size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/npcs/v2/high-keeper-varn.avif
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild High Keeper Varn AVIF'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
