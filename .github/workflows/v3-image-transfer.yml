name: Reconstruct Greywake v3 Image Assets

on:
  push:
    branches: [main]
    paths:
      - 'v3/.transport/**'
      - '.github/workflows/v3-image-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v3-image-transfer
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct and validate images
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import base64, hashlib

          specs = {
              'great-shell': {'out': Path('v3/assets/great-shell-canon-visual-reference.jpg'), 'sha256': 'a8ede3250cefe1da0cda9d2c78f2043155efb92a5ffcaeb4e5affcc3b333d053', 'size': 239812, 'format': 'jpeg'},
              'cacklemaw-pack': {'out': Path('v3/assets/cacklemaw-pack-stonelip-view.jpg'), 'sha256': '815fce8381fb77415d1f5fe78c3884e64db18c147061920302d551490b8acdc7', 'size': 151943, 'format': 'jpeg'},
              'latchfan-mature': {'out': Path('v3/assets/latchfan-01-mature-specimen.jpg'), 'sha256': '139f2b45bae80746d0583ca26ec02993dfdd089d78260e94ca602a7bba04139c', 'size': 269047, 'format': 'jpeg'},
              'latchfan-habitat': {'out': Path('v3/assets/latchfan-02-stonelip-habitat.jpg'), 'sha256': '5aff354d148b58bb8ef7a0269dee0a664f91152896f0ae0333fdeff6535fb906', 'size': 265392, 'format': 'jpeg'},
              'caravan-gate': {'out': Path('assets/generated-scenes/caravan-gate.webp'), 'sha256': 'a331d31789b801fc8d611115e2301de5ee03b4c7649e124397b766f9dad4e6ee', 'size': 13452, 'format': 'webp'},
          }

          root = Path('v3/.transport')
          if not root.exists():
              print('No transport payload present; nothing to reconstruct.')
              raise SystemExit(0)

          built = 0
          for key, spec in specs.items():
              image_dir = root / key
              if not image_dir.exists():
                  continue
              chunk_files = sorted(image_dir.glob('*.b64'))
              if not chunk_files:
                  print(f'{key}: no .b64 chunks found; skipping')
                  continue
              encoded = ''.join(p.read_text(encoding='ascii').strip() for p in chunk_files)
              try:
                  data = base64.b64decode(encoded, validate=True)
              except Exception as exc:
                  raise SystemExit(f'{key}: invalid base64 payload: {exc}')
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != spec['size']:
                  raise SystemExit(f'{key}: size mismatch {len(data)} != {spec["size"]}')
              if digest != spec['sha256']:
                  raise SystemExit(f'{key}: sha256 mismatch {digest} != {spec["sha256"]}')
              if spec['format'] == 'jpeg' and (not data.startswith(b'\xff\xd8\xff') or not data.endswith(b'\xff\xd9')):
                  raise SystemExit(f'{key}: reconstructed file is not a complete JPEG')
              if spec['format'] == 'webp' and not (data.startswith(b'RIFF') and data[8:12] == b'WEBP'):
                  raise SystemExit(f'{key}: reconstructed file is not a complete WebP')
              spec['out'].parent.mkdir(parents=True, exist_ok=True)
              spec['out'].write_bytes(data)
              print(f'{key}: wrote {len(data)} bytes sha256={digest}')
              built += 1

          if built == 0:
              raise SystemExit('No complete known image payloads were reconstructed.')
          PY

      - name: Commit finished binaries and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/assets assets/generated-scenes
          git rm -r v3/.transport
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated Greywake image assets'
            git push
          fi
