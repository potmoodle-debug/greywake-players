name: Deploy Greywake Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'v3/**'
      - '.github/workflows/v3-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build direct image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/generated

          decode_one() {
            src="$1"
            dest="$2"
            python -c 'import base64,sys; from pathlib import Path; s="".join(Path(sys.argv[1]).read_text(encoding="ascii").split()); s += "=" * (-len(s) % 4); data=base64.b64decode(s, validate=False); Path(sys.argv[2]).write_bytes(data); print(f"decoded {sys.argv[1]} -> {sys.argv[2]} ({len(data)} bytes)")' "$src" "$dest"
            test -s "$dest"
          }

          decode_parts() {
            dest="$1"
            shift
            python -c 'import base64,sys; from pathlib import Path; dest=sys.argv[1]; s="".join("".join(Path(p).read_text(encoding="ascii").split()) for p in sys.argv[2:]); s += "=" * (-len(s) % 4); data=base64.b64decode(s, validate=False); Path(dest).write_bytes(data); print(f"decoded {len(sys.argv)-2} parts -> {dest} ({len(data)} bytes)")' "$dest" "$@"
            test -s "$dest"
          }

          decode_one assets/obsidian-b64/clay-character-poster.b64 assets/generated/clay-character-poster.avif
          decode_parts assets/generated/clay-ranger-loadout.avif \
            assets/obsidian-b64/clay-ranger-loadout/01.b64 \
            assets/obsidian-b64/clay-ranger-loadout/02.b64 \
            assets/obsidian-b64/clay-ranger-loadout/03.b64

          decode_one assets/obsidian-b64/odie-repairer-character-poster.b64 assets/generated/odie-repairer-character-poster.avif
          decode_one assets/obsidian-b64/odie-equipment-and-repair-reference-board.b64 assets/generated/odie-equipment-and-repair-reference-board.avif
          decode_one assets/obsidian-b64/odie-white-door-dark.b64 assets/generated/odie-white-door-dark.webp

          decode_parts assets/generated/mara-vell.avif \
            assets/obsidian-b64/mara-vell-avif/01.b64 \
            assets/obsidian-b64/mara-vell-avif/02.b64 \
            assets/obsidian-b64/mara-vell-avif/03.b64 \
            assets/obsidian-b64/mara-vell-avif/04.b64

          decode_one assets/obsidian-b64/high-keeper-varn/01.b64 assets/generated/high-keeper-varn.webp
          decode_one assets/obsidian-b64/selka-marr/01.b64 assets/generated/selka-marr.webp
          decode_one assets/obsidian-b64/brannic-hale/01.b64 assets/generated/brannic-hale.webp
          decode_one assets/obsidian-b64/nemi/01.b64 assets/generated/nemi.webp
          decode_one assets/obsidian-b64/talla-reed/01.b64 assets/generated/talla-reed.webp
          decode_one assets/obsidian-b64/joric-noll/01.b64 assets/generated/joric-noll.webp
          decode_one assets/obsidian-b64/bessa-trant/01.b64 assets/generated/bessa-trant.webp
          decode_one assets/obsidian-b64/hessa-vey/01.b64 assets/generated/hessa-vey.webp

          echo "Generated direct image assets:"
          ls -lh assets/generated

      - name: Normalize published NPC portraits to AVIF
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow pillow-avif-plugin
          mkdir -p .staging/npc-avif-src
          decode_one() {
            python -c 'import base64,sys; from pathlib import Path; s="".join(Path(sys.argv[1]).read_text(encoding="ascii").split()); s += "=" * (-len(s) % 4); data=base64.b64decode(s, validate=False); Path(sys.argv[2]).write_bytes(data)' "$1" "$2"
            test -s "$2"
          }
          decode_one assets/obsidian-b64/talla-reed/01.b64 .staging/npc-avif-src/talla-reed.img
          decode_one assets/obsidian-b64/joric-noll/01.b64 .staging/npc-avif-src/joric-noll.img
          decode_one assets/obsidian-b64/bessa-trant/01.b64 .staging/npc-avif-src/bessa-trant.img
          decode_one assets/obsidian-b64/hessa-vey/01.b64 .staging/npc-avif-src/hessa-vey.img

          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import pillow_avif

          root = Path('assets/npcs/v2')
          sources = {
              Path('assets/npcs/v2/brannic-hale-player-portrait.jpg'): root / 'brannic-hale.avif',
              Path('assets/npcs/v2/sister-elowen-player-portrait.jpg'): root / 'sister-elowen.avif',
              Path('.staging/npc-avif-src/talla-reed.img'): root / 'talla-reed.avif',
              Path('.staging/npc-avif-src/joric-noll.img'): root / 'joric-noll.avif',
              Path('.staging/npc-avif-src/bessa-trant.img'): root / 'bessa-trant.avif',
              Path('.staging/npc-avif-src/hessa-vey.img'): root / 'hessa-vey.avif',
          }
          for src, out in sources.items():
              if not src.exists():
                  raise SystemExit(f'Missing portrait source: {src}')
              with Image.open(src) as im:
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGB')
                  im.save(out, format='AVIF', quality=82, speed=6)

          app = Path('v2/app.js')
          text = app.read_text(encoding='utf-8')
          for old, new in {
              'assets/npcs/v2/brannic-hale-player-portrait.jpg':'assets/npcs/v2/brannic-hale.avif',
              'assets/npcs/v2/sister-elowen-player-portrait.jpg':'assets/npcs/v2/sister-elowen.avif',
              'assets/npcs/v2/joric-noll.jpg':'assets/npcs/v2/joric-noll.avif',
              'assets/npcs/v2/talla-reed.jpg':'assets/npcs/v2/talla-reed.avif',
          }.items():
              text = text.replace(old, new)

          anchor = "    'Mara Vell':[{src:'assets/npcs/v2/mara-vell.avif',caption:'Mara Vell — Dust Broker at Valve Court.',portrait:true,focal:'50% 32%'}]"
          additions = [
              "    'High Keeper Varn':[{src:'assets/npcs/v2/high-keeper-varn.avif',caption:'High Keeper Varn — leader of the Cistern Keepers.',portrait:true,focal:'50% 32%'}]",
              "    'Selka Marr':[{src:'assets/npcs/v2/selka-marr.avif',caption:'Selka Marr — Caravan Syndicate figure.',portrait:true,focal:'50% 32%'}]",
              "    'Nemi':[{src:'assets/npcs/v2/nemi.avif',caption:'Nemi — child from Tangle Lanes.',portrait:true,focal:'50% 32%'}]",
              "    'Hessa Vey':[{src:'assets/npcs/v2/hessa-vey.avif',caption:'Hessa Vey — senior Digger and salvage-claim organiser.',portrait:true,focal:'50% 32%'}]",
              "    'Bessa Trant':[{src:'assets/npcs/v2/bessa-trant.avif',caption:'Bessa Trant — Kestrel Return crew member.',portrait:true,focal:'50% 32%'}]",
          ]
          if anchor not in text:
              raise SystemExit('DIRECT_MEDIA Mara Vell anchor not found; refusing unsafe edit')
          missing = [line for line in additions if line.split("':",1)[0].strip() not in text]
          if missing:
              text = text.replace(anchor, anchor + ',\n' + ',\n'.join(missing))
          app.write_text(text, encoding='utf-8')
          PY

      - name: Persist normalized NPC portraits
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/npcs/v2/*.avif v2/app.js
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize NPC portraits to AVIF'
            git push
          fi

      - name: Improve Caravan Gate site image
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          path = Path('assets/generated-scenes/caravan-gate.webp')
          if not path.exists():
              raise SystemExit(f'Missing Caravan Gate image: {path}')

          with Image.open(path) as im:
              im = im.convert('RGB')
              target = (1672, 941)
              if im.size != target:
                  im = im.resize(target, Image.Resampling.LANCZOS)
              im = im.filter(ImageFilter.UnsharpMask(radius=1.2, percent=115, threshold=3))
              im.save(path, format='WEBP', quality=95, method=6)
              print(f'Caravan Gate prepared for site at {im.size}')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
