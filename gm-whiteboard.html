<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greywake — GM Whiteboard</title>
<style>
:root{font-family:Georgia,serif;color:#eee1c6;background:#111719}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #e8c891}header{height:65px;background:#191d1d;border-bottom:1px solid #534634;display:flex;gap:12px;align-items:center;padding:10px 16px;position:relative;z-index:5}header strong{font-size:20px;letter-spacing:.12em}small,.kicker{font:11px system-ui;letter-spacing:.12em;text-transform:uppercase;color:#c8ac7d}a{color:#e9cd92}button{background:#30332f;border:1px solid #6c614d;color:#eee1c6;border-radius:6px;padding:8px 10px}button:hover{border-color:#d5b676;background:#413d30}.primary{background:#795e38}.spacer{flex:1}#app{display:flex;height:calc(100vh - 65px)}aside{width:292px;flex:none;background:#1b2021;border-right:1px solid #514736;display:flex;flex-direction:column;z-index:4}aside .search{padding:13px;display:grid;gap:8px}input,select,textarea{color:#f1e6d5;background:#101719;border:1px solid #574e41;border-radius:5px;padding:10px;width:100%}#library{overflow:auto;padding:0 10px 18px}#library button{display:block;text-align:left;width:100%;margin:6px 0;padding:10px;background:#292e2e}#library button span{display:block;font:10px system-ui;color:#c9ac7d;margin-bottom:4px}main{flex:1;position:relative;overflow:hidden;background-color:#202828;background-image:radial-gradient(#64706a55 1px,transparent 1px);background-size:26px 26px;touch-action:none;cursor:grab}main.panning{cursor:grabbing}#world{position:absolute;left:0;top:0;transform-origin:0 0;width:1px;height:1px}#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}#edges path{fill:none;stroke:#b79a60;stroke-width:2;stroke-dasharray:6 4}.card{position:absolute;width:238px;min-height:155px;border:1px solid #a58a5e;background:#272927;box-shadow:0 9px 28px #0008;border-radius:9px;overflow:hidden;cursor:default}.card.selected{outline:2px solid #efd48d}.card .handle{background:#34332b;display:flex;justify-content:space-between;align-items:center;cursor:move;padding:7px 9px;font:11px system-ui;color:#e9cd92}.card .body{padding:13px}.card h3{font-size:21px;line-height:1.1;margin:5px 0 10px;color:#f6ead1}.card p{color:#d1c9bb;font:12px/1.5 system-ui;margin:0;max-height:96px;overflow:auto}.card img{width:100%;height:105px;object-fit:cover;display:block}.card .foot{display:flex;gap:4px;padding:8px;background:#202423}.card .foot button{padding:5px 7px;font:11px system-ui;flex:1}.chip{border:1px solid #776749;border-radius:4px;padding:3px 6px;font:10px system-ui;display:inline-block;color:#d7b979}.hint{position:absolute;bottom:13px;left:15px;background:#111b1cd9;padding:9px 12px;color:#d4c8b5;font:12px system-ui;pointer-events:none}.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tools button{font:12px system-ui}.board-select{max-width:180px}.modal{position:fixed;inset:0;background:#000b;z-index:15;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{background:#252b2c;border:1px solid #9b8458;border-radius:12px;width:min(520px,92vw);max-height:85vh;overflow:auto;padding:22px;display:grid;gap:11px}.dialog h2{margin:0}.dialog textarea{min-height:150px;resize:vertical}.details{font:13px/1.6 system-ui;white-space:pre-wrap;color:#e1d3bd;max-height:40vh;overflow:auto}.status{font:11px system-ui;color:#bfb4a1}#empty{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);color:#bdb09c;pointer-events:none;text-align:center}#empty h2{font-size:28px;margin:0 0 7px}.mobileToggle{display:none}@media(max-width:800px){aside{position:absolute;top:65px;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}.mobileToggle{display:block}header strong{font-size:14px}header .tools{overflow-x:auto;flex-wrap:nowrap}header button{white-space:nowrap}.hint{max-width:70%}}
body.embedded>header{display:none}body.embedded #app{height:100vh}body.embedded{background:#14150f}body.embedded #canvas{background-color:#1b1e1b;background-image:radial-gradient(#79705735 1px,transparent 1px)}body.embedded aside{background:#171813}body.embedded .card{background:#23241e;border-color:#887245}body.embedded .card .handle{background:#30291c}body.embedded .card .foot{background:#181a15}body.embedded .card h3{color:#eee0ba}body.embedded .hint{background:#151711e8}@media(max-width:800px){body.embedded aside{top:0}}\n</style></head><body>
<header><button id="back">← RUN</button><strong>GREYWAKE <small> / GM WHITEBOARD</small></strong><div class="spacer"></div><button class="mobileToggle" id="libraryToggle">Library</button><div class="tools"><select id="boardSelect" class="board-select" aria-label="Board"></select><button id="newBoard">+ Board</button><button id="renameBoard">Rename</button><button id="clearBoard">Clear</button><button id="zoomOut">−</button><button id="zoomReset">100%</button><button id="zoomIn">+</button><button id="exportBoard">Export</button><button id="importBoard">Import</button></div></header>
<div id="app"><aside id="sidebar"><div class="search"><small>THE CAMPAIGN LIBRARY</small><button class="mobileToggle" id="insideLibraryToggle">☰ Card library</button><input id="search" placeholder="Search people, creatures, places…" aria-label="Search cards"><select id="category"><option value="">All categories</option></select><button class="primary" id="customCard">+ Create GM note</button><span class="status" id="count"></span></div><div id="library"></div></aside><main id="canvas" aria-label="Interactive whiteboard"><div id="world"><svg id="edges" width="1" height="1"></svg><div id="cards"></div></div><div id="empty"><h2>Your campaign, on the table.</h2>Search the library and click a record to add its card.</div><div class="hint">Drag cards to arrange · Drag background to pan · Scroll to zoom · Select two cards then Link</div></main></div>
<div id="modal" class="modal" role="dialog" aria-modal="true"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalContent"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button id="modalCancel">Close</button><button id="modalSave" class="primary">Save</button></div></div></div><input type="file" id="fileInput" accept=".json,application/json" hidden>
<script src="data.js?v=foldling2"></script>
<script src="flora-extra.js"></script><script src="locations-extra.js"></script><script src="npc-extra.js"></script><script src="reference-extra.js"></script><script src="shared-knowledge.js"></script><script src="rumour-locations.js"></script><script src="spencer-digger.js"></script><script src="session03.js"></script><script src="session04.js"></script><script src="session05.js"></script><script src="jobs.js"></script><script src="inventory-extra.js"></script><script src="media.js"></script>
<script>
(()=>{
'use strict';
if(new URLSearchParams(location.search).has('embedded'))document.body.classList.add('embedded');
const KEY='greywake.gm.whiteboard.v1', OWNER='greywake-player-view-v1';
if(localStorage.getItem(OWNER)!=='gm'){document.body.innerHTML='<main style="padding:40px"><h1>GM whiteboard</h1><p>Switch to the GM profile in Greywake before opening this page.</p><a href="./#/gm-session">Return to Greywake</a></main>';return;}
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const raw=window.GREYWAKE_DATA||{};
const records=Object.entries(raw).map(([key,v])=>({key,title:v.title||key,category:v.category||'Record',html:v.html||''})).filter(r=>r.title);
const images=Object.fromEntries(Object.entries(window.GREYWAKE_MEDIA||{}).filter(([k,v])=>Array.isArray(v)&&v[0]?.src).map(([k,v])=>[k,v[0].src]));
const initial=()=>({active:'session',boards:[{id:'session',name:'Current Session',cards:[],links:[],pan:{x:130,y:90,z:1}}],notes:[]});
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')||initial();if(!Array.isArray(state.boards)||!state.boards.length)state=initial()}catch{state=initial()}
let selected=[],drag=null,saveError=false;
const board=()=>state.boards.find(b=>b.id===state.active)||state.boards[0];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));saveError=false}catch(e){if(!saveError){alert('Could not save the whiteboard. Export your board as a backup.');saveError=true}}};
const plain=html=>{const el=document.createElement('div');el.innerHTML=html||'';return(el.textContent||'').replace(/\s+/g,' ').trim()};
const all=()=>records.concat(state.notes.map(n=>({key:'note:'+n.id,title:n.title,category:n.category||'GM Note',html:'<p>'+esc(n.text)+'</p>',note:true})));
const get=k=>all().find(r=>r.key===k);
function categories(){const cat=$('category'),v=cat.value;cat.innerHTML='<option value="">All categories</option>'+[...new Set(all().map(x=>x.category))].sort().map(x=>'<option>'+esc(x)+'</option>').join('');cat.value=v}
function library(){const q=$('search').value.trim().toLowerCase(),category=$('category').value;const list=all().filter(r=>(!category||r.category===category)&&(!q||(r.title+' '+r.category+' '+plain(r.html)).toLowerCase().includes(q))).sort((a,b)=>a.title.localeCompare(b.title));$('count').textContent=list.length+' available records · click to add';$('library').innerHTML=list.map(r=>'<button data-add="'+esc(r.key)+'"><span>'+esc(r.category)+'</span>'+esc(r.title)+'</button>').join('')}
function add(key){const b=board(),r=get(key);if(!r)return;const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),i=b.cards.length;b.cards.push({id,key,x:(170+i*39)%900,y:(80+i*42)%550});selected=[id];save();renderBoard();$('sidebar').classList.remove('open')}
function cardHtml(c){const r=get(c.key);if(!r)return '';const snippet=plain(r.html).slice(0,230);return '<div class="card '+(selected.includes(c.id)?'selected':'')+'" data-card="'+esc(c.id)+'" style="left:'+c.x+'px;top:'+c.y+'px"><div class="handle" data-handle="'+esc(c.id)+'"><span>⠿ MOVE</span><span>'+esc(r.category)+'</span></div>'+(images[r.key]?'<img loading="lazy" src="'+esc(images[r.key])+'" alt="">':'')+'<div class="body"><span class="chip">'+esc(r.category)+'</span><h3>'+esc(r.title)+'</h3><p>'+esc(snippet||'Open to see this record.')+'</p></div><div class="foot"><button data-open="'+esc(c.id)+'">Open / flip</button><button data-link="'+esc(c.id)+'">Link</button><button data-remove="'+esc(c.id)+'">Remove</button></div></div>'}
function drawLinks(){const b=board(),find=id=>b.cards.find(c=>c.id===id);$('edges').innerHTML=b.links.map(l=>{const a=find(l.a),c=find(l.b);if(!a||!c)return '';const x=a.x+119,y=a.y+85,xx=c.x+119,yy=c.y+85;return '<path d="M '+x+' '+y+' L '+xx+' '+yy+'"/>'}).join('')}
function renderBoard(){const b=board();$('cards').innerHTML=b.cards.map(cardHtml).join('');drawLinks();$('empty').hidden=!!b.cards.length;const p=b.pan||{x:0,y:0,z:1};$('world').style.transform='translate('+p.x+'px,'+p.y+'px) scale('+p.z+')';$('zoomReset').textContent=Math.round(p.z*100)+'%';$('boardSelect').innerHTML=state.boards.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');$('boardSelect').value=b.id}
function modal(title,content,onSave){$('modalTitle').textContent=title;$('modalContent').innerHTML=content;$('modal').classList.add('open');$('modalSave').hidden=!onSave;$('modalSave').onclick=()=>{if(onSave()!==false)$('modal').classList.remove('open')}}
function detail(id){const c=board().cards.find(x=>x.id===id),r=c&&get(c.key);if(!r)return;modal(r.title,'<small>'+esc(r.category)+'</small><div class="details">'+esc(plain(r.html)||'No notes recorded.')+'</div>'+(r.note?'<button id="editNote">Edit this GM note</button>':''),null);$('editNote')?.addEventListener('click',()=>{ $('modal').classList.remove('open');editNote(r)})}
function editNote(r){const old=r?.note?r:null;modal(old?'Edit GM note':'Create GM note','<label>Title<input id="noteTitle" maxlength="100" value="'+esc(old?.title||'')+'"></label><label>Category<input id="noteCat" maxlength="60" value="'+esc(old?.category||'GM Note')+'"></label><label>Notes<textarea id="noteText"></textarea></label>',()=>{const title=$('noteTitle').value.trim();if(!title){$('noteTitle').focus();return false}const note=old?state.notes.find(x=>'note:'+x.id===old.key):{id:Date.now().toString(36)};note.title=title;note.category=$('noteCat').value.trim()||'GM Note';note.text=$('noteText').value;if(!old)state.notes.push(note);save();categories();library();renderBoard();if(!old)add('note:'+note.id)});$('noteText').value=old?plain(old.html):''}
function link(id){if(!selected.includes(id))selected.push(id);if(selected.length>2)selected=selected.slice(-2);if(selected.length===2){const b=board(),[a,c]=selected;if(a!==c&&!b.links.some(l=>(l.a===a&&l.b===c)||(l.a===c&&l.b===a))){b.links.push({a,b:c});save()}selected=[]}renderBoard()}
$('library').onclick=e=>{const el=e.target.closest('[data-add]');if(el)add(el.dataset.add)};
$('search').oninput=library;$('category').onchange=library;
$('customCard').onclick=()=>editNote(null);
$('cards').addEventListener('click',e=>{const el=e.target.closest('[data-open],[data-remove],[data-link]');if(!el)return;const id=el.dataset.open||el.dataset.remove||el.dataset.link;if(el.hasAttribute('data-open'))detail(id);else if(el.hasAttribute('data-link'))link(id);else if(el.hasAttribute('data-remove')){const b=board();b.cards=b.cards.filter(c=>c.id!==id);b.links=b.links.filter(l=>l.a!==id&&l.b!==id);selected=selected.filter(x=>x!==id);save();renderBoard()}});
const canvas=$('canvas');
canvas.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,textarea'))return;const handle=e.target.closest('[data-handle]');const p=board().pan;if(handle){const c=board().cards.find(x=>x.id===handle.dataset.handle);if(!c)return;selected=[c.id];drag={type:'card',id:c.id,x:e.clientX,y:e.clientY,ox:c.x,oy:c.y,z:p.z};}else if(!e.target.closest('.card'))drag={type:'pan',x:e.clientX,y:e.clientY,ox:p.x,oy:p.y};else return;canvas.setPointerCapture(e.pointerId);canvas.classList.add('panning');});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const b=board();if(drag.type==='pan'){b.pan.x=drag.ox+e.clientX-drag.x;b.pan.y=drag.oy+e.clientY-drag.y;$('world').style.transform='translate('+b.pan.x+'px,'+b.pan.y+'px) scale('+b.pan.z+')'}else{const c=b.cards.find(x=>x.id===drag.id);if(!c)return;c.x=Math.round(drag.ox+(e.clientX-drag.x)/drag.z);c.y=Math.round(drag.oy+(e.clientY-drag.y)/drag.z);const el=$('cards').querySelector('[data-card="'+c.id+'"]');if(el){el.style.left=c.x+'px';el.style.top=c.y+'px'}drawLinks()}});
function endDrag(){if(drag){drag=null;save();canvas.classList.remove('panning');renderBoard()}}canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
function zoom(f,cx,cy){const b=board(),p=b.pan,z=Math.max(.35,Math.min(2.5,p.z*f)),ox=cx??canvas.clientWidth/2,oy=cy??canvas.clientHeight/2;const ratio=z/p.z;p.x=ox-(ox-p.x)*ratio;p.y=oy-(oy-p.y)*ratio;p.z=z;save();renderBoard()}
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.08:.92,e.clientX-canvas.getBoundingClientRect().left,e.clientY-canvas.getBoundingClientRect().top)},{passive:false});
$('zoomIn').onclick=()=>zoom(1.2);$('zoomOut').onclick=()=>zoom(1/1.2);$('zoomReset').onclick=()=>{board().pan={x:120,y:80,z:1};save();renderBoard()};
$('newBoard').onclick=()=>modal('New whiteboard','<label>Board name<input id="boardName" maxlength="70" placeholder="White Door mystery"></label>',()=>{const name=$('boardName').value.trim();if(!name)return false;const b={id:'b'+Date.now().toString(36),name,cards:[],links:[],pan:{x:120,y:80,z:1}};state.boards.push(b);state.active=b.id;save();renderBoard()});
$('renameBoard').onclick=()=>modal('Rename whiteboard','<label>Board name<input id="boardName" maxlength="70" value="'+esc(board().name)+'"></label>',()=>{const name=$('boardName').value.trim();if(!name)return false;board().name=name;save();renderBoard()});
$('clearBoard').onclick=()=>{if(confirm('Remove all cards and links from this board? Source records and other boards will remain.')){board().cards=[];board().links=[];save();renderBoard()}};
$('boardSelect').onchange=e=>{state.active=e.target.value;selected=[];save();renderBoard()};
$('back').onclick=()=>location.href='./#/gm-session';$('libraryToggle').onclick=()=>$('sidebar').classList.toggle('open');$('insideLibraryToggle').onclick=()=>$('sidebar').classList.toggle('open');
$('exportBoard').onclick=()=>{const data=JSON.stringify(state,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='greywake-whiteboards.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
$('importBoard').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const incoming=JSON.parse(await f.text());if(!Array.isArray(incoming.boards)||!Array.isArray(incoming.notes)||!incoming.boards.every(b=>Array.isArray(b.cards)&&Array.isArray(b.links)&&b.pan))throw Error('Invalid board file');if(confirm('Replace your local whiteboards with the imported backup?')){state=incoming;state.active=state.boards[0].id;save();categories();library();renderBoard()}}catch(e){alert('Import failed: '+e.message)}e.target.value=''};
$('modalCancel').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
window.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open')});
categories();library();renderBoard();
})();
</script></body></html>
